modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "GNU General Public License v3.0"

[[mods]]
modId = "trainutilities"
version = "${version}"
displayName = "Create Train Utilities"
authors = "ProgrammerLP"
description = '''
Mod that adds custom sliding doors with realistic opening & closing sounds and station blocks, and also building blocks for stations and trains.
'''
logoFile = "mod_icon.png"

[[dependencies.trainutilities]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.trainutilities]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.trainutilities]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.trainutilities]]
modId = "dragonlib"
type = "required"
versionRange = "[beta-3.0.23,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.trainutilities]]
modId = "create"
type = "required"
versionRange = "[6.0.7,]"
ordering = "NONE"
side = "BOTH"

# Optional, enables the Steam 'n' Rails sliding door modes on TrainUtilities doors.
# Range kept wide on purpose: 1.21.1 is only served by the unofficial 0.x port for now.
[[dependencies.trainutilities]]
modId = "railways"
type = "optional"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "trainutilities.mixins.json"
