architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modImplementation("com.simibubi.create:create-fabric-${rootProject.minecraft_version}:${rootProject.create_fabric_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version")

    // Optional: Create Steam 'n' Rails, for its sliding door modes.
    // Compile only, everything touching it is guarded by a mod loaded check.
    modCompileOnly("maven.modrinth:create-steam-n-rails:${rootProject.steam_n_rails_fabric_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
}
